<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoSignal247 - Live Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <!-- Top Nav -->
    <nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500 -ml-6"></div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 via-orange-500 to-yellow-300 bg-clip-text text-transparent">
                    CryptoSignal247
                </span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">LIVE</span>
            </div>
            <div class="flex items-center space-x-4 text-xs sm:text-sm text-slate-400">
                <span>Updated: <strong id="lastUpdated" class="text-emerald-400 font-mono">Syncing...</strong></span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header Banner -->
        <div class="mb-8 p-6 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-slate-800/80 border border-slate-800 shadow-2xl flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Automated Market Signals</h1>
                <p class="text-sm text-slate-400 mt-1">24/7 Automated Technical Screener & Volume Alerts</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="text" id="searchInput" placeholder="Search symbol (e.g. BTC)..." class="bg-slate-800 border border-slate-700 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-400 text-white placeholder-slate-500 w-full md:w-64">
                <button onclick="loadData()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl transition text-sm flex items-center gap-2">
                    <span>↻</span> Refresh
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-slate-900/80 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider bg-slate-900/90">
                            <th class="py-4 px-6">Symbol</th>
                            <th class="py-4 px-6">Price</th>
                            <th class="py-4 px-6">24h Change</th>
                            <th class="py-4 px-6">RSI (14)</th>
                            <th class="py-4 px-6">Timeframe</th>
                            <th class="py-4 px-6 text-center">Signal</th>
                        </tr>
                    </thead>
                    <tbody id="signalsBody" class="divide-y divide-slate-800/60 font-mono text-sm">
                        <tr>
                            <td colspan="6" class="py-12 text-center text-slate-500 font-sans">
                                Loading live screener data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        Powered by CryptoSignal247 • Automated 24/7 GitHub Workflows
    </footer>

    <script>
        let allSignals = [];

        function getSignalBadge(signal) {
            const s = (signal || '').toUpperCase();
            if (s.includes('STRONG BUY')) {
                return '<span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">🚀 STRONG BUY</span>';
            } else if (s.includes('BUY')) {
                return '<span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">BUY</span>';
            } else if (s.includes('STRONG SELL')) {
                return '<span class="px-3 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">⚠️ STRONG SELL</span>';
            } else if (s.includes('SELL')) {
                return '<span class="px-3 py-1 rounded-full text-xs font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">SELL</span>';
            } else if (s.includes('OVERSOLD')) {
                return '<span class="px-3 py-1 rounded-full text-xs font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">OVERSOLD</span>';
            }
            return '<span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700">NEUTRAL</span>';
        }

        function renderRows(items) {
            const tbody = document.getElementById('signalsBody');
            if (!items || items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-500">No signals found matching your filter</td></tr>';
                return;
            }
            tbody.innerHTML = items.map(coin => {
                const changeIsPos = (coin.change_24h || '').startsWith('+');
                const changeColor = changeIsPos ? 'text-emerald-400' : (coin.change_24h ? 'text-rose-400' : 'text-slate-400');
                return `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="py-4 px-6 font-bold text-white tracking-wide">${coin.symbol}</td>
                        <td class="py-4 px-6 text-slate-200">$${coin.price}</td>
                        <td class="py-4 px-6 font-semibold ${changeColor}">${coin.change_24h || '-'}</td>
                        <td class="py-4 px-6 text-slate-300">${coin.rsi || '-'}</td>
                        <td class="py-4 px-6 text-slate-400 text-xs">${coin.timeframe || '1h'}</td>
                        <td class="py-4 px-6 text-center">${getSignalBadge(coin.signal)}</td>
                    </tr>
                `;
            }).join('');
        }

        async function loadData() {
            try {
                const res = await fetch('data.json?cache=' + Date.now());
                const data = await res.json();
                document.getElementById('lastUpdated').innerText = data.last_updated || 'Just now';
                allSignals = data.signals || data.coins || [];
                applyFilter();
            } catch (e) {
                console.error('Error fetching data.json:', e);
                document.getElementById('lastUpdated').innerText = 'Syncing...';
            }
        }

        function applyFilter() {
            const q = document.getElementById('searchInput').value.trim().toUpperCase();
            if (!q) {
                renderRows(allSignals);
            } else {
                const filtered = allSignals.filter(item => (item.symbol || '').toUpperCase().includes(q));
                renderRows(filtered);
            }
        }

        document.getElementById('searchInput').addEventListener('input', applyFilter);
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
